name: CrashKit verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Core, reader, demo and documentation
        run: make verify CC=${{ matrix.compiler }}
      - name: Address and undefined-behavior sanitizers
        run: make sanitize CC=${{ matrix.compiler }}
      - name: Package and clean host acceptance
        run: |
          make package CC=${{ matrix.compiler }}
          CC=${{ matrix.compiler }} python3 scripts/verify-release.py build/release/freertos-crashkit-0.2.0.tar.gz

  rv32:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-misc
      - name: Verified official dependency
        run: python3 scripts/fetch-freertos.py
      - name: Cross-toolchain
        run: docker build -f scripts/Dockerfile.rv32 -t freertos-crashkit-rv32:bookworm .
      - name: Build reference firmware
        run: docker run --rm --user "$(id -u):$(id -g)" --network none --cap-drop ALL --security-opt no-new-privileges --cpus 2 --memory 512m -v "$PWD:/work" -w /work freertos-crashkit-rv32:bookworm python3 scripts/build-rv32.py
      - name: Fault capture and ELF matching
        run: make qemu-test
      - name: Offline diagnostics and actual GDB acceptance
        run: docker run --rm --user "$(id -u):$(id -g)" --network none --cap-drop ALL --security-opt no-new-privileges --cpus 2 --memory 512m -v "$PWD:/work" -w /work freertos-crashkit-rv32:bookworm python3 scripts/test-debug.py
